<!DOCTYPE html>
<html>
<head><title>Новый пароль</title></head>
<body style="font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
        <h2 style="text-align: center;">🔒 Новый пароль</h2>
        <p style="text-align: center; color: #666;">Придумайте сложный пароль.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                Сохранить пароль
            </button>
        </form>
    </div>
</body>
</html>
