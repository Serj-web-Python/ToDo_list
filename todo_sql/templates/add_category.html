<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая категория</title>
</head>
<body>
    <h1>Создать новую категорию 📁</h1>

    <div style="background-color: #e0f7fa; padding: 20px; border-radius: 10px;">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить категорию</button>
        </form>
    </div>

    <br>
    <a href="{% url 'index' %}">Назад к списку</a>

</body>
</html>
